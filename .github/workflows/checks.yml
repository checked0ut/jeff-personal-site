name: Checks

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  copy-guard:
    name: Copy guard (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report rendered-text diff
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/master' }}
        run: python3 .github/scripts/copy_guard.py >> "$GITHUB_STEP_SUMMARY"

  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML
        run: npx --yes html-validate@10 "index.html" "404.html" "projects/**/index.html"
