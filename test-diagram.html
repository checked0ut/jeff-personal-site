<!DOCTYPE html>
<html>
<head>
  <title>Evening Routine Workflow</title>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
  </script>
</head>
<body>
  <h1>Evening Routine Workflow</h1>
  <div class="mermaid">
    flowchart TD
      A[Person Comes Home] --> B[Eats Dinner]
      B --> C[Sits Down]
      C --> D{Eat More?}
      D -->|Yes| E[Eat More]
      D -->|No| F{Hungry Again?}
      F -->|Yes| G[Heat Up Dinner & Eat]
      F -->|No| H[Watch TV]
      E --> F
      G --> H
  </div>
</body>
</html>
